<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOTOBASE</title>
  <meta name="description" content="MOTOBASE 공식 링크 모음 — 유튜브, 인스타그램, 네이버 블로그, 문의">
  <meta property="og:title" content="MOTOBASE">
  <meta property="og:description" content="MOTOBASE 공식 링크 모음">
  <meta property="og:url" content="https://motobase.co.kr/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://motobase.co.kr/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#231916">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="manifest" href="site.webmanifest">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #231916;      /* 로고의 짙은 바탕색 */
      --blue: #2EA7E0;     /* 로고의 하늘색 */
      --paper: #EDEEEE;
      --card: #FFFFFF;
      --muted: #6B6563;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 56px 16px 32px;
    }
    main { width: 100%; max-width: 440px; display: flex; flex-direction: column; }

    .logo { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
    .tagline { text-align: center; color: var(--muted); font-size: 15px; margin: 20px 0 36px; }

    .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 60px; padding: 0 18px;
      background: var(--ink); color: #fff;
      border-radius: 14px;
      text-decoration: none; font-size: 16px; font-weight: 600;
      transition: transform .15s ease, background-color .15s ease;
    }
    .link:hover { background: #3a2c28; transform: translateY(-2px); }
    .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .link svg { flex: none; width: 24px; height: 24px; fill: var(--blue); }
    .link .label { flex: 1; }
    .link .arrow { color: var(--blue); font-size: 18px; }

    .mail {
      margin-top: 28px; padding: 18px;
      background: var(--card); border-radius: 14px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .mail svg { width: 22px; height: 22px; fill: var(--blue); flex: none; }
    .mail-text { flex: 1; min-width: 0; }
    .mail-text small { display: block; color: var(--muted); font-size: 13px; }
    .mail-text a { color: var(--ink); font-weight: 600; text-decoration: none; word-break: break-all; }
    .mail-text a:hover { color: var(--blue); }
    .copy {
      border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
      border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .copy:hover { background: var(--ink); color: #fff; }

    footer { margin-top: auto; padding-top: 48px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 style="margin:0">
      <img class="logo" src="assets/logo.svg" alt="MOTOBASE" width="360" height="88">
    </h1>
    <p class="tagline">모토베이스 공식 채널</p>

    <!-- ▼ 각 href 를 실제 채널 주소로 바꿔주세요 -->
    <ul class="links">
      <li>
        <a class="link" href="https://www.youtube.com/@motobaseTV" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF0000" d="M23.5 6.5a3 3 0 0 0-2.1-2.1C19.5 4 12 4 12 4s-7.5 0-9.4.4A3 3 0 0 0 .5 6.5 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.5 3 3 0 0 0 2.1 2.1C4.5 20 12 20 12 20s7.5 0 9.4-.4a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.5z"/><path fill="#FFFFFF" d="M9.6 15.6V8.4l6.3 3.6z"/></svg>
          <span class="label">YouTube</span><span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.instagram.com/motobasetv" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>
          <span class="label">Instagram</span><span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://blog.naver.com/motobase2025" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2h18a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm4.5 5v10h3.3v-5.2L14.3 17h3.2V7h-3.3v5.2L10.7 7H7.5z"/></svg>
          <span class="label">네이버 블로그</span><span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>

    <!-- 메일 주소는 스팸 수집 봇을 줄이기 위해 스크립트로 조합합니다 -->
    <div class="mail">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm10 8.2L3.4 6.5v11.5h17.2V6.5L12 12.2zM4.6 6 12 10.9 19.4 6H4.6z"/></svg>
      <div class="mail-text">
        <small>문의 · 협업 제안</small>
        <a id="mail" data-u="motocross" data-d="empal.com" href="#">메일 주소 보기</a>
      </div>
      <button class="copy" id="copy" type="button">복사</button>
    </div>

    <div class="mail">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
      <div class="mail-text">
        <small>전화 문의</small>
        <a href="tel:032-671-5410">032-671-5410</a>
      </div>
      <button class="copy" id="copy-tel" type="button" data-copy="032-671-5410">복사</button>
    </div>

    <footer>© 2025 MOTOBASE · motobase.co.kr</footer>
  </main>

  <script>
    (function () {
      var a = document.getElementById('mail');
      var addr = a.dataset.u + '@' + a.dataset.d;
      a.href = 'mailto:' + addr;
      a.textContent = addr;
      document.getElementById('copy').dataset.copy = addr;
      document.querySelectorAll('.copy').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var done = function () { btn.textContent = '복사됨'; setTimeout(function () { btn.textContent = '복사'; }, 1500); };
          if (navigator.clipboard) navigator.clipboard.writeText(btn.dataset.copy).then(done, function () {});
        });
      });
    })();
  </script>
</body>
</html>
